<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Better Call Lesyf</title>

<style>
body {
  margin: 0;
  font-family: Arial Black, Arial, sans-serif;
  background: #0b0b0b;
  color: white;
  overflow-x: hidden;
}

/* 🎬 INTRO */
#intro {
  position: fixed;
  width: 100%;
  height: 100%;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  animation: fadeOut 2.5s ease forwards;
  animation-delay: 2s;
}

#intro h1 {
  color: #f5c518;
  font-size: 40px;
  text-shadow: 0 0 20px red;
}

@keyframes fadeOut {
  to { opacity: 0; visibility: hidden; }
}

/* HEADER */
header {
  background: linear-gradient(90deg, #f5c518, #ff2b2b);
  text-align: center;
  padding: 15px;
  color: black;
  font-size: 24px;
}

/* HERO */
.hero {
  text-align: center;
  padding: 40px 20px;
  background: url('https://images.unsplash.com/photo-1528747045269-390fe33c19c1') center/cover;
}

.hero h1 {
  font-size: 40px;
  color: #f5c518;
  text-shadow: 0 0 15px black;
  animation: glow 2s infinite alternate;
}

@keyframes glow {
  from { text-shadow: 0 0 5px #f5c518; }
  to { text-shadow: 0 0 25px red; }
}

/* PROFILE CARD */
.profile {
  max-width: 500px;
  margin: 20px auto;
  background: #151515;
  padding: 20px;
  border-left: 5px solid #f5c518;
  text-align: center;
  border-radius: 10px;
}

.profile p {
  color: #aaa;
}

/* BUTTONS */
.btn {
  display: inline-block;
  padding: 10px 15px;
  margin: 8px;
  border-radius: 6px;
  text-decoration: none;
  color: white;
  font-weight: bold;
  transition: 0.3s;
}

.btn:hover {
  transform: scale(1.05);
  filter: brightness(1.3);
}

/* STREAM */
.container {
  display: flex;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
  padding: 20px;
}

iframe {
  border-radius: 10px;
  border: 3px solid #f5c518;
}

/* SERVICES */
.services {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 15px;
  max-width: 900px;
  margin: auto;
  padding: 10px;
}

.card {
  background: #1b1b1b;
  padding: 15px;
  border-left: 4px solid red;
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-5px);
  background: #222;
}

/* CONTACTS */
.contacts {
  text-align: center;
  padding: 30px;
}

/* FOOTER */
footer {
  text-align: center;
  padding: 20px;
  background: black;
  font-size: 12px;
  color: #777;
}

/* 📱 MOBILE */
@media (max-width: 768px) {
  .hero h1 { font-size: 28px; }

  .container {
    flex-direction: column;
    align-items: center;
  }

  iframe {
    width: 95%;
    height: 300px;
  }

  .btn {
    display: block;
    width: 80%;
    margin: 10px auto;
  }
}
</style>
</head>

<body>

<!-- 🎬 INTRO -->
<div id="intro">
  <h1>BETTER CALL LESYF ⚖️</h1>
</div>

<header>BETTER CALL LESYF ⚖️</header>

<section class="hero">
  <h1>Адвокат скуки</h1>
</section>

<!-- 👤 PROFILE -->
<div class="profile">

  <a class="btn" style="background:#ff2b2b;" href="https://www.twitch.tv/say_lesyf" target="_blank">Twitch</a>
</div>

<!-- STREAM -->
<div class="container">
  <iframe src="https://player.twitch.tv/?channel=say_lesyf&parent=nekrashevichartema-art.github.io"
  height="400" width="700" allowfullscreen></iframe>

  <iframe src="https://www.twitch.tv/embed/say_lesyf/chat?parent=nekrashevichartema-art.github.io"
  height="400" width="300"></iframe>
</div>

<!-- SERVICES -->
<section class="services">
  <div class="card">🎮 Игры</div>
  <div class="card">😂 Мемы</div>
  <div class="card">🔥 Чат</div>
  <div class="card">⚖️ Адвокат</div>
</section>

<!-- CONTACTS -->
<section class="contacts">
  <h2>Связь</h2>

  <a class="btn" style="background:#2AABEE;" href="https://t.me/T1mas_Shelbi" target="_blank">Telegram</a>

  <a class="btn" style="background:#1b2838;" href="https://steamcommunity.com/profiles/76561199700178651" target="_blank">Steam</a>

  <p>Discord: artem_shelbyl</p>
</section>

<footer>© 2026 Better Call Lesyf</footer>

</body>
</html>

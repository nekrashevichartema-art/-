<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Better Call Lesyf</title>

<style>
body {
  margin: 0;
  font-family: Arial Black, Arial, sans-serif;
  color: white;
  overflow-x: hidden;
  background: url('https://i.redd.it/i-made-sauls-office-in-3d-as-a-tribute-to-one-of-the-best-v0-at3sjmp1ooh91.jpg?width=1920&format=pjpg&auto=webp&s=07e3ce6f7265e76fe28f5d84930aab088d1ad919') center/cover fixed;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at center, rgba(0,0,0,0.25), rgba(0,0,0,0.85));
  z-index: -2;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(0,0,0,0.4) 80%, rgba(0,0,0,0.8) 100%);
}

#intro {
  position: fixed;
  inset: 0;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  animation: fadeOut 4.5s ease forwards;
}

#intro h1 {
  font-size: 52px;
  color: #f5c518;
  letter-spacing: 4px;
  animation: logoIn 2.5s ease forwards;
}

@keyframes logoIn {
  0% { opacity: 0; transform: scale(0.85); }
  60% { opacity: 1; transform: scale(1.05); }
  100% { transform: scale(1); }
}

@keyframes fadeOut {
  0% { opacity: 1; }
  80% { opacity: 1; }
  100% { opacity: 0; visibility: hidden; }
}

header {
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(8px);
  text-align: center;
  padding: 15px;
  color: #f5c518;
}

.hero {
  text-align: center;
  padding: 40px 20px;
}

.hero h1 {
  color: #f5c518;
  animation: glow 3s infinite alternate;
}

@keyframes glow {
  from { text-shadow: 0 0 5px #f5c518; }
  to { text-shadow: 0 0 20px #f5c518; }
}

.fade {
  opacity: 0;
  transform: translateY(40px);
  transition: 0.8s ease;
}

.fade.show {
  opacity: 1;
  transform: translateY(0);
}

.symbols {
  text-align: center;
  font-size: 24px;
}

.block {
  text-align: center;
  padding: 20px;
}

.container {
  display: flex;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
  padding: 20px;
  opacity: 0;
  transform: scale(0.95);
  transition: 1s ease;
}

.container.show {
  opacity: 1;
  transform: scale(1);
}

iframe {
  border: 2px solid #f5c518;
  border-radius: 10px;
}

.btn {
  display: inline-block;
  padding: 12px 18px;
  margin: 5px;
  border-radius: 10px;
  text-decoration: none;
  color: white;
  transition: 0.3s;
}

.btn:hover {
  transform: scale(1.08);
}

.tg { background: #2AABEE; }
.dc { background: #5865F2; }
.st { background: #1b2838; }

.contacts {
  text-align: center;
  padding: 40px;
}

@media (max-width: 768px) {
  iframe {
    width: 95%;
    height: 300px;
  }

  .container {
    flex-direction: column;
    align-items: center;
  }
}
</style>
</head>

<body>

<div id="intro">
  <h1>BETTER CALL LESYF</h1>
</div>

<audio id="introSound" src="phone-ring.mp3" preload="auto"></audio>
<audio id="clickSound" src="historical-antique-phone-ring-01.mp3" preload="auto"></audio>

<header>BETTER CALL LESYF ⚖️</header>

<section class="hero fade">
  <h1>SAUL OFFICE</h1>
  <p>стримы, игры и хаос</p>
</section>

<div class="symbols fade">⚖ ⚔ LESYF ⚔ ⚖</div>

<div class="block fade">
  <h2>ОБО МНЕ</h2>
  <p>Стримы, игры и стиль в духе Better Call Saul.</p>
</div>

<div class="container fade">
  <iframe src="https://player.twitch.tv/?channel=say_lesyf&parent=nekrashevichartema-art.github.io"
    height="400" width="700" allowfullscreen></iframe>

  <iframe src="https://www.twitch.tv/embed/say_lesyf/chat?parent=nekrashevichartema-art.github.io"
    height="400" width="300"></iframe>
</div>

<section class="contacts fade">
  <h2>Контакты</h2>

  <a class="btn tg" href="https://t.me/T1mas_Shelbi" target="_blank" rel="noopener noreferrer">Telegram</a>
  <a class="btn dc" href="https://discord.com/users/artem_shelbyl" target="_blank" rel="noopener noreferrer">Discord</a>
  <a class="btn st" href="https://steamcommunity.com/profiles/76561199700178651/" target="_blank" rel="noopener noreferrer">Steam</a>
</section>

<script>
const elements = document.querySelectorAll('.fade');

function checkScroll() {
  const trigger = window.innerHeight * 0.85;

  elements.forEach(el => {
    if (el.getBoundingClientRect().top < trigger) {
      el.classList.add('show');
    }
  });
}

window.addEventListener('scroll', checkScroll);
window.addEventListener('load', checkScroll);

/* клики */
function playClick() {
  const sound = document.getElementById("clickSound");
  sound.currentTime = 0;
  sound.volume = 0.5;
  sound.play();
}

document.querySelectorAll('.btn').forEach(b => {
  b.addEventListener('click', playClick);
});

/* интро звук */
let introPlayed = false;

function playIntroSound() {
  if (introPlayed) return;
  introPlayed = true;

  const sound = document.getElementById("introSound");
  sound.volume = 0.6;

  sound.play().catch(() => {
    document.addEventListener("click", () => sound.play(), { once: true });
  });
}

window.addEventListener("load", () => {
  setTimeout(playIntroSound, 500);
});
</script>

</body>
</html>

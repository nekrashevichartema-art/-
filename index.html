<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Better Call Lesyf</title>

<style>
body {
  margin: 0;
  font-family: Arial Black, Arial, sans-serif;
  background: #070707;
  color: white;
  overflow-x: hidden;
}

/* 🎬 INTRO */
#intro {
  position: fixed;
  inset: 0;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  animation: introFade 2.8s ease forwards;
  animation-delay: 1.8s;
}

#intro h1 {
  font-size: 42px;
  color: #f5c518;
  text-shadow: 0 0 25px red;
  animation: pulse 1.2s infinite alternate;
}

@keyframes introFade {
  to { opacity: 0; visibility: hidden; }
}

@keyframes pulse {
  from { transform: scale(1); }
  to { transform: scale(1.08); }
}

/* 🧭 NAVBAR */
nav {
  position: sticky;
  top: 0;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(10px);
  padding: 10px;
  text-align: center;
  z-index: 100;
  border-bottom: 2px solid #f5c518;
}

/* HEADER */
header {
  text-align: center;
  padding: 25px;
  font-size: 24px;
  background: linear-gradient(90deg, #f5c518, #ff2b2b);
  color: black;
}

/* HERO */
.hero {
  text-align: center;
  padding: 60px 20px;
  background: url('https://images.unsplash.com/photo-1528747045269-390fe33c19c1') center/cover;
}

.hero h1 {
  font-size: 44px;
  color: #f5c518;
  text-shadow: 0 0 20px black;
  animation: glow 2s infinite alternate;
}

@keyframes glow {
  from { text-shadow: 0 0 5px #f5c518; }
  to { text-shadow: 0 0 30px red; }
}

/* PROFILE CARD (glass effect) */
.profile {
  max-width: 500px;
  margin: 20px auto;
  padding: 20px;
  text-align: center;

  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  backdrop-filter: blur(10px);
}

/* BUTTONS */
.btn {
  display: inline-block;
  padding: 12px 18px;
  margin: 8px;
  border-radius: 8px;
  text-decoration: none;
  color: white;
  font-weight: bold;
  transition: 0.25s;
}

.btn:hover {
  transform: scale(1.07);
  filter: brightness(1.4);
}

/* STREAM */
.container {
  display: flex;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
  padding: 20px;
}

iframe {
  border-radius: 12px;
  border: 2px solid #f5c518;
}

/* SERVICES */
.services {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  max-width: 900px;
  margin: auto;
  gap: 15px;
  padding: 10px;
}

.card {
  background: #111;
  padding: 15px;
  border-left: 4px solid red;
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-6px);
  background: #1a1a1a;
}

/* CONTACTS */
.contacts {
  text-align: center;
  padding: 30px;
}

/* FOOTER */
footer {
  text-align: center;
  padding: 20px;
  background: black;
  font-size: 12px;
  color: #777;
}

/* 📱 MOBILE */
@media (max-width: 768px) {
  .hero h1 { font-size: 28px; }

  .container {
    flex-direction: column;
    align-items: center;
  }

  iframe {
    width: 95%;
    height: 300px;
  }

  .btn {
    display: block;
    width: 80%;
    margin: 10px auto;
  }
}
</style>
</head>

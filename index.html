<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Better Call Lesyf</title>

<style>
body {
  margin: 0;
  font-family: Arial Black, Arial, sans-serif;
  color: white;
  overflow-x: hidden;
  /* Фикс наложения слоев: делаем фон частью body, а не псевдоэлемента */
  background: radial-gradient(circle at center, rgba(0,0,0,0.25), rgba(0,0,0,0.85)), 
              url('https://i.redd.it/i-made-sauls-office-in-3d-as-a-tribute-to-one-of-the-best-v0-at3sjmp1ooh91.jpg?width=1920&format=pjpg&auto=webp&s=07e3ce6f7265e76fe28f5d84930aab088d1ad919') center/cover fixed;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(0,0,0,0.4) 80%, rgba(0,0,0,0.8) 100%);
  z-index: 1;
}

#intro {
  position: fixed;
  inset: 0;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  animation: fadeOut 4.5s ease forwards;
  pointer-events: none; /* Чтобы интро не мешало кликать после исчезновения */
}

#intro h1 {
  font-size: 52px;
  color: #f5c518;
  letter-spacing: 4px;
  text-align: center;
  padding: 20px;
  animation: logoIn 2.5s ease forwards;
}

@keyframes logoIn {
  0% { opacity: 0; transform: scale(0.85); }
  60% { opacity: 1; transform: scale(1.05); }
  100% { transform: scale(1); }
}

@keyframes fadeOut {
  0% { opacity: 1; visible: visible; }
  80% { opacity: 1; }
  100% { opacity: 0; visibility: hidden; }
}

header {
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  text-align: center;
  padding: 15px;
  color: #f5c518;
  position: sticky;
  top: 0;
  z-index: 10;
  border-bottom: 1px solid rgba(245, 197, 24, 0.3);
}

.hero {
  text-align: center;
  padding: 60px 20px 40px;
}

.hero h1 {
  color: #f5c518;
  font-size: 48px;
  margin-bottom: 10px;
  animation: glow 3s infinite alternate;
}

@keyframes glow {
  from { text-shadow: 0 0 5px #f5c518, 0 0 10px rgba(245, 197, 24, 0.5); }
  to { text-shadow: 0 0 20px #f5c518, 0 0 30px #f5c518; }
}

/* Базовый класс для плавной анимации появления */
.fade {
  opacity: 0;
  transform: translateY(40px);
  transition: all 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

.fade.show {
  opacity: 1;
  transform: translateY(0);
}

.symbols {
  text-align: center;
  font-size: 24px;
  color: #f5c518;
  margin: 20px 0;
}

.block {
  text-align: center;
  padding: 20px;
  max-width: 600px;
  margin: 0 auto;
}

.block p {
  font-family: Arial, sans-serif;
  line-height: 1.6;
}

.container {
  display: flex;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
  padding: 20px;
}

iframe {
  border: 2px solid #f5c518;
  border-radius: 10px;
  box-shadow: 0 0 15px rgba(0,0,0,0.5);
}

.btn {
  display: inline-block;
  padding: 12px 24px;
  margin: 8px;
  border-radius: 10px;
  text-decoration: none;
  color: white;
  font-size: 16px;
  transition: transform 0.2s, box-shadow 0.2s;
  box-shadow: 0 4px 6px rgba(0,0,0,0.3);
}

.btn:hover {
  transform: scale(1.08) translateY(-2px);
  box-shadow: 0 6px 12px rgba(245, 197, 24, 0.2);
}

.tg { background: #2AABEE; }
.dc { background: #5865F2; }
.st { background: #1b2838; border: 1px solid #2a475e; }

.contacts {
  text-align: center;
  padding: 60px 20px;
}

/* Мобильная адаптивность */
@media (max-width: 768px) {
  .hero h1 { font-size: 32px; }
  
  iframe {
    width: 100%;
    max-width: 100%;
    height: 250px;
  }

  /* Скрываем чат твича на мобилках, так как он не влезает по ширине */
  iframe[src*="chat"] {
    display: none;
  }

  .container {
    padding: 10px;
  }
}
</style>
</head>

<body>

<div id="intro">
  <h1>BETTER CALL LESYF</h1>
</div>

<!-- Аудиофайлы -->
<audio id="introSound" src="phone-ring.mp3" preload="auto"></audio>
<audio id="clickSound" src="historical-antique-phone-ring-01.mp3" preload="auto"></audio>

<header>BETTER CALL LESYF ⚖️</header>

<section class="hero fade">
  <h1>SAUL OFFICE</h1>
  <p>стримы, игры и хаос</p>
</section>

<div class="symbols fade">⚖ ⚔ LESYF ⚔ ⚖</div>

<div class="block fade">
  <h2>ОБО МНЕ</h2>
  <p>Стримы, игры и стиль в духе Better Call Saul. Добро пожаловать в офис самого безбашенного адвоката Твича.</p>
</div>

<!-- Фикс: Анимация вешается на сам контейнер, и он плавно появляется -->
<div class="container fade">
  <iframe src="https://player.twitch.tv/?channel=say_lesyf&parent=nekrashevichartema-art.github.io"
    height="400" width="700" allowfullscreen></iframe>

  <iframe src="https://www.twitch.tv/embed/say_lesyf/chat?parent=nekrashevichartema-art.github.io"
    height="400" width="300"></iframe>
</div>

<section class="contacts fade">
  <h2>Контакты</h2>
  <a class="btn tg" href="https://t.me/T1mas_Shelbi" target="_blank" rel="noopener noreferrer">Telegram</a>
  <a class="btn dc" href="https://discord.com/users/artem_shelbyl" target="_blank" rel="noopener noreferrer">Discord</a>
  <a class="btn st" href="https://steamcommunity.com/profiles/76561199700178651/" target="_blank" rel="noopener noreferrer">Steam</a>
</section>

<script>
// Скрипт плавного появления блоков при скролле
const elements = document.querySelectorAll('.fade');

function checkScroll() {
  const trigger = window.innerHeight * 0.88; // Чуть увеличили область срабатывания

  elements.forEach(el => {
    if (el.getBoundingClientRect().top < trigger) {
      el.classList.add('show');
    }
  });
}

window.addEventListener('scroll', checkScroll);
window.addEventListener('load', checkScroll);

// Звук при клике на кнопки
function playClick() {
  const sound = document.getElementById("clickSound");
  sound.currentTime = 0;
  sound.volume = 0.4;
  sound.play().catch(err => console.log("Звук заблокирован:", err));
}

document.querySelectorAll('.btn').forEach(b => {
  b.addEventListener('click', playClick);
});

// Фикс автовоспроизведения звука интро
let introPlayed = false;
const introSound = document.getElementById("introSound");

function tryPlayIntro() {
  if (introPlayed) return;
  introSound.volume = 0.5;
  
  introSound.play()
    .then(() => {
      introPlayed = true;
      // Убираем слушатели, если звук успешно заиграл
      document.removeEventListener('click', tryPlayIntro);
      document.removeEventListener('keydown', tryPlayIntro);
      document.removeEventListener('touchstart', tryPlayIntro);
    })
    .catch(() => {
      // Если браузер заблокировал, звук включится автоматически при первом действии
      console.log("Ожидание действия пользователя для включения звука...");
    });
}

// Пытаемся включить через полсекунды
window.addEventListener("load", () => {
  setTimeout(tryPlayIntro, 500);
});

// Навешиваем слушатели на случай блокировки браузером
document.addEventListener('click', tryPlayIntro);
document.addEventListener('keydown', tryPlayIntro);
document.addEventListener('touchstart', tryPlayIntro);
</script>

</body>
</html>

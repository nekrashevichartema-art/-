<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Better Call Lesyf</title>
  <style>
    body {
      margin: 0;
      font-family: 'Arial Black', Arial, sans-serif;
      background: #111;
      color: #fff;
    }

    header {
      background: linear-gradient(90deg, #f5c518, #ff0000);
      padding: 20px;
      text-align: center;
      color: black;
      font-size: 28px;
      letter-spacing: 2px;
    }

    .hero {
      text-align: center;
      padding: 40px 20px;
      background: url('https://images.unsplash.com/photo-1534447677768-be436bb09401') center/cover;
    }

    .hero h1 {
      font-size: 48px;
      color: #f5c518;
      text-shadow: 2px 2px 10px black;
    }

    .hero p {
      font-size: 18px;
    }

    .btn {
      background: red;
      color: white;
      padding: 12px 25px;
      text-decoration: none;
      border-radius: 5px;
      display: inline-block;
      margin-top: 15px;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn:hover {
      background: #ff4444;
      transform: scale(1.05);
    }

    .container {
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 20px;
      flex-wrap: wrap;
    }

    iframe {
      border-radius: 10px;
      border: 3px solid #f5c518;
    }

    .ad {
      background: #f5c518;
      color: black;
      padding: 20px;
      margin: 20px auto;
      max-width: 800px;
      border: 5px dashed red;
      text-align: center;
    }

    .ad h2 {
      margin: 0;
      font-size: 28px;
    }

    .services {
      max-width: 900px;
      margin: 20px auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    .card {
      background: #1c1c1f;
      padding: 15px;
      border-left: 5px solid red;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #000;
      margin-top: 40px;
      font-size: 14px;
    }
  </style>
</head>
<body>

<header>
  BETTER CALL LESYF ⚖️
</header>

<section class="hero">
  <h1>Лучше смотри стрим 😏</h1>
  <p>Игры, хаос и немного "юридических" советов</p>
  <a class="btn" href="https://www.twitch.tv/say_lesyf" target="_blank">Смотреть на Twitch</a>
</section>

<div class="container">
  <iframe src=https://player.twitch.tv/?channel=say_lesyf&parent=nekrashevichartema-art.github.io height="400" width="700" allowfullscreen></iframe>
  <iframe src="https://www.twitch.tv/embed/say_lesyf/chat?parent=localhost" height="400" width="300"></iframe>
</div>

<section class="ad">
  <h2>ПОПАЛ В СКУЧНЫЙ ВЕЧЕР?</h2>
  <p>ЗВОНИ... ТО ЕСТЬ СМОТРИ LESYF!</p>
</section>

<section class="services">
  <div class="card">🎮 Игровые стримы</div>
  <div class="card">😂 Мемы и угар</div>
  <div class="card">🔥 Общение с чатом</div>
  <div class="card">⚖️ "Юридическая помощь" (почти)</div>
</section>

<footer>
  <p>© 2026 Better Call Lesyf</p>
</footer>

</body>
</html>

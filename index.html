<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Better Call Lesyf</title>

<style>
body {
  margin: 0;
  font-family: Arial Black, Arial, sans-serif;
  color: white;
  background: url('https://i.redd.it/i-made-sauls-office-in-3d-as-a-tribute-to-one-of-the-best-v0-at3sjmp1ooh91.jpg?width=1920&format=pjpg&auto=webp&s=07e3ce6f7265e76fe28f5d84930aab088d1ad919') center/cover fixed;
}

/* затемнение */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  z-index: -1;
}

/* 🎬 CINEMATIC INTRO */
#intro {
  position: fixed;
  inset: 0;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  animation: fadeOut 4.5s ease forwards;
}

/* логотип */
#intro h1 {
  font-size: 48px;
  color: #f5c518;
  letter-spacing: 4px;
  opacity: 0;
  transform: scale(0.8);
  animation: logoIn 2.5s ease forwards;
}

/* появление логотипа */
@keyframes logoIn {
  0% { opacity: 0; transform: scale(0.8); filter: blur(5px); }
  60% { opacity: 1; transform: scale(1.05); filter: blur(0px); }
  100% { opacity: 1; transform: scale(1); }
}

/* исчезновение интро */
@keyframes fadeOut {
  0% { opacity: 1; }
  70% { opacity: 1; }
  100% { opacity: 0; visibility: hidden; }
}

/* HEADER */
header {
  background: linear-gradient(90deg, #f5c518, #ff0000);
  padding: 15px;
  text-align: center;
  color: black;
}

/* HERO */
.hero {
  text-align: center;
  padding: 50px 20px;
}

.hero h1 {
  font-size: 44px;
  color: #f5c518;
}

/* SYMBOLS */
.symbols {
  text-align: center;
  font-size: 24px;
}

.sword {
  color: #66ff66;
  display: inline-block;
  transition: transform 0.1s linear;
}

/* BLOCK */
.block {
  text-align: center;
  padding: 20px;
}

/* BUTTON */
.btn {
  background: red;
  color: white;
  padding: 12px 18px;
  border-radius: 8px;
  text-decoration: none;
  display: inline-block;
  margin: 5px;
  transition: 0.2s;
}

.btn:hover {
  transform: scale(1.05);
}

/* STREAM */
.container {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 20px;
  padding: 20px;
}

iframe {
  border: 2px solid #f5c518;
  border-radius: 10px;
}

/* CONTACTS */
.contacts {
  text-align: center;
  padding: 30px;
}

/* MOBILE */
@media (max-width: 768px) {
  iframe {
    width: 95%;
    height: 300px;
  }

  .container {
    flex-direction: column;
    align-items: center;
  }
}
</style>
</head>

<body>

<!-- 🎬 INTRO -->
<div id="intro">
  <h1>BETTER CALL LESYF</h1>
</div>

<header>
  BETTER CALL LESYF ⚖️
</header>

<section class="hero">
  <h1>SAUL OFFICE</h1>
  <p>стримы, игры и хаос</p>
</section>

<div class="symbols">
  ⚖ <span class="sword" id="sword">⚔</span> LESYF <span class="sword" id="sword2">⚔</span> ⚖
</div>

<div class="block">
  <h2>ОБО МНЕ</h2>
  <p>Стримы, игры и стиль в духе Better Call Saul.</p>
</div>

<div class="container">
  <iframe src="https://player.twitch.tv/?channel=say_lesyf&parent=nekrashevichartema-art.github.io"
  height="400" width="700"></iframe>

  <iframe src="https://www.twitch.tv/embed/say_lesyf?parent=nekrashevichartema-art.github.io"
  height="400" width="300"></iframe>
</div>

<section class="contacts">
  <h2>Контакты</h2>

  <a class="btn" style="background:#2AABEE;" href="https://t.me/T1mas_Shelbi">Telegram</a>
  <a class="btn" style="background:#5865F2;" href="https://discord.com/users/artem_shelbyl">Discord</a>
</section>

<script>
document.addEventListener("mousemove", (e) => {

  let x = (e.clientX / window.innerWidth - 0.5) * 20;
  let y = (e.clientY / window.innerHeight - 0.5) * 20;

  document.getElementById("sword").style.transform =
    `translate(${x}px, ${y}px) rotate(${x}deg)`;

  document.getElementById("sword2").style.transform =
    `translate(${-x}px, ${-y}px) rotate(${-x}deg)`;
});
</script>

</body>
</html>

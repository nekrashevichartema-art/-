<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Better Call Lesyf</title>

<style>
body {
  margin: 0;
  font-family: Arial Black, Arial, sans-serif;
  color: white;

  background: url('https://i.redd.it/i-made-sauls-office-in-3d-as-a-tribute-to-one-of-the-best-v0-at3sjmp1ooh91.jpg?width=1920&format=pjpg&auto=webp&s=07e3ce6f7265e76fe28f5d84930aab088d1ad919') center/cover fixed;
}

/* затемнение базы */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at center, rgba(0,0,0,0.2), rgba(0,0,0,0.75));
  z-index: -2;
}

/* 🎬 КИНО-ВИНЬЕТКА */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;

  background: radial-gradient(
    ellipse at center,
    rgba(0,0,0,0) 35%,
    rgba(0,0,0,0.25) 60%,
    rgba(0,0,0,0.65) 100%
  );

  z-index: 0;
}

/* 🎬 INTRO */
#intro {
  position: fixed;
  inset: 0;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  animation: fadeOut 4.5s ease forwards;
}

#intro h1 {
  font-size: 52px;
  color: #f5c518;
  letter-spacing: 4px;
  opacity: 0;
  transform: scale(0.85);
  animation: logoIn 2.5s ease forwards;
}

@keyframes logoIn {
  0% { opacity: 0; transform: scale(0.85); filter: blur(6px); }
  60% { opacity: 1; transform: scale(1.05); filter: blur(0); }
  100% { opacity: 1; transform: scale(1); }
}

@keyframes fadeOut {
  0% { opacity: 1; }
  80% { opacity: 1; }
  100% { opacity: 0; visibility: hidden; }
}

/* HEADER */
header {
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(10px);
  text-align: center;
  padding: 15px;
  color: #f5c518;
  position: relative;
  z-index: 2;
}

/* HERO */
.hero {
  text-align: center;
  padding: 50px 20px;
  position: relative;
  z-index: 2;
}

.hero h1 {
  color: #f5c518;
}

/* SYMBOLS */
.symbols {
  text-align: center;
  font-size: 24px;
  position: relative;
  z-index: 2;
}

.sword {
  color: #66ff66;
  display: inline-block;
}

/* BLOCK */
.block {
  text-align: center;
  padding: 20px;
  position: relative;
  z-index: 2;
}

/* BUTTON */
.btn {
  display: inline-block;
  padding: 12px 18px;
  margin: 5px;
  border-radius: 10px;
  text-decoration: none;
  color: white;
  transition: 0.2s;
}

.btn:hover {
  transform: scale(1.05);
}

/* COLORS */
.tg { background: #2AABEE; }
.dc { background: #5865F2; }
.st { background: #1b2838; }

/* STREAM */
.container {
  display: flex;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
  padding: 20px;
  position: relative;
  z-index: 2;
}

iframe {
  border: 2px solid #f5c518;
  border-radius: 10px;
}

/* CONTACTS */
.contacts {
  text-align: center;
  padding: 40px;
  position: relative;
  z-index: 2;
}

/* MOBILE */
@media (max-width: 768px) {
  iframe {
    width: 95%;
    height: 300px;
  }

  .container {
    flex-direction: column;
    align-items: center;
  }
}
</style>
</head>

<body>

<!-- INTRO -->
<div id="intro">
  <h1>BETTER CALL LESYF</h1>
</div>

<header>
  BETTER CALL LESYF ⚖️
</header>

<section class="hero">
  <h1>SAUL OFFICE</h1>
  <p>стримы, игры и хаос</p>
</section>

<div class="symbols">
  ⚖ <span class="sword">⚔</span> LESYF <span class="sword">⚔</span> ⚖
</div>

<div class="block">
  <h2>ОБО МНЕ</h2>
  <p>Стримы, игры и стиль в духе Better Call Saul.</p>
</div>

<div class="container">
  <iframe src="https://player.twitch.tv/?channel=say_lesyf&parent=nekrashevichartema-art.github.io"
  height="400" width="700"></iframe>

  <iframe src="https://www.twitch.tv/embed/say_lesyf?parent=nekrashevichartema-art.github.io"
  height="400" width="300"></iframe>
</div>

<section class="contacts">
  <h2>Контакты</h2>

  <a class="btn tg" href="https://t.me/T1mas_Shelbi">📩 Telegram — перейти</a>
  <a class="btn dc" href="https://discord.com/users/artem_shelbyl">💬 Discord — перейти</a>
  <a class="btn st" href="https://steamcommunity.com/profiles/76561199700178651/">🎮 Steam — перейти</a>
</section>

</body>
</html>
